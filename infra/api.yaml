openapi: 3.0.3
info:
  title: Lockstep Recall Control Plane API
  version: 1.0.0
paths:
  /plans:
    post:
      summary: Submit an ActionPlan for evaluation and execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActionPlan'
      responses:
        '200':
          description: Plan executed or denied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GateResult'

components:
  schemas:
    ActionPlan:
      type: object
      required:
        - plan_id
        - incident_id
        - stage
        - actions
      properties:
        plan_id:
          type: string
        incident_id:
          type: string
        stage:
          type: string
        schema_version:
          type: integer
        actions:
          type: array
          items:
            type: object
            required:
              - id
              - tool
              - args
              - blast_radius
              - rollback
              - expected_effect
              - justification_ref
            properties:
              id:
                type: string
              tool:
                type: string
              args:
                type: object
              blast_radius:
                type: object
              rollback:
                type: object
              expected_effect:
                type: object
              justification_ref:
                type: string

    GateResult:
      type: object
      properties:
        gate:
          type: string
        decision:
          type: string
          enum: [pass, deny]
        reason_code:
          type: string
        invariant:
          type: string
        why:
          type: string
        values:
          type: object
        citation:
          type: object
        hint:
          type: string
        retries_left:
          type: integer
        latency_ms:
          type: integer
        schema_version:
          type: integer
